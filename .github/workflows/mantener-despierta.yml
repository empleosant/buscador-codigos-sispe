name: Mantener la app despierta

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar navegador
        run: |
          pip install --quiet playwright
          playwright install chromium --with-deps

      - name: Abrir la aplicación
        env:
          URL: https://buscador-codigos-sispe.streamlit.app
        run: python scripts/despertar.py
